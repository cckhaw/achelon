name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: achelon
          POSTGRES_PASSWORD: achelon
          POSTGRES_DB: achelon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U achelon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL_OWNER: postgresql://achelon:achelon@localhost:5432/achelon_test
      TEST_DATABASE_URL: postgresql://achelon_app:achelon_app@localhost:5432/achelon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: No CSV files in the repo
        run: scripts/check-no-csv.sh all
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      # Fail on new high/critical advisories in production dependencies.
      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        env:
          DATABASE_URL: postgresql://achelon_app:achelon_app@localhost:5432/achelon_test
          DATABASE_URL_OWNER: postgresql://achelon:achelon@localhost:5432/achelon_test
          APP_SECRET: ci-placeholder-secret-at-least-32-characters-long
          APP_URL: http://localhost:3000
          PLATFORM_ADMIN_EMAILS: platform-operator@e2e.invalid
        run: npm run build
      - name: End-to-end (iPhone + desktop viewports)
        env:
          DATABASE_URL: postgresql://achelon_app:achelon_app@localhost:5432/achelon_test
          DATABASE_URL_OWNER: postgresql://achelon:achelon@localhost:5432/achelon_test
          APP_SECRET: ci-placeholder-secret-at-least-32-characters-long
          APP_URL: http://localhost:3000
          PLATFORM_ADMIN_EMAILS: platform-operator@e2e.invalid
          STRAVA_MODE: mock
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
